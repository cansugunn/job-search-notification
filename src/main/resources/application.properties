server.port=8081
spring.application.name=job-search-notification
server.servlet.context-path=/notification
server.forward-headers-strategy=framework

# MongoDB
spring.data.mongodb.uri=${MONGO_URI}

# Redis
spring.data.redis.url=${REDIS_URL}
job-search.system-token.ttl-seconds=3600

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

# RabbitMQ
spring.rabbitmq.addresses=${RABBITMQ_URL}
job-search.rabbitmq.queue=new-job-postings

# Job Search Service base URL (via gateway)
job-search.api.base-url=${JOB_SEARCH_API_URL}

# Supabase
job-search.supabase.url=${SUPABASE_URL}
job-search.supabase.api-key=${INTERNAL_ADMIN_TOKEN}

# System user credentials (used to obtain a JWT for internal API calls)
job-search.system-user.email=${SYSTEM_USER_EMAIL}
job-search.system-user.password=${SYSTEM_USER_PASSWORD}
job-search.system-token.ttl-seconds=3500
job-search.system-token.lock-ttl-seconds=10

# Secret sent in X-Scheduler-Secret header by Google Cloud Scheduler
job-search.scheduler.secret=${SCHEDULER_SECRET}

# Logging
logging.level.com.jobsearch.notification=INFO
